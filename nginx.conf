# Serving the SOFTNET site on a real host.
#
# The site is no longer a folder of finished files: since the news pages are
# rendered when they are opened (so a story's real title and cover photo can be
# written into the page for Facebook and Google), a Node program runs behind the
# web server. This file is that front door.
#
# It replaces the old config, which pointed at .output/public and served the
# files directly. That output is still written by the build, but it is no longer
# the whole site — the pages that matter are made on each request by the program
# in .output/server.

server {
    listen 80;
    listen [::]:80;
    server_name softnetitc.edu.ph www.softnetitc.edu.ph;

    # Start the app on the host (or with pm2/systemd, so it comes back after a
    # restart):  npm ci && npm run build && npm start
    # It listens on 127.0.0.1:3000 by default. Change it with NUXT_PORT.
    location / {
        proxy_pass http://127.0.0.1:3000;

        # The app needs to know the address the READER used, not the one it was
        # reached on: that address is what goes into a story's share card and
        # its canonical link. Without these two lines every shared story would
        # name 127.0.0.1.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The build's own files (styles, scripts, the school's photos) are served as
    # plain files: the program does not need to be woken for a picture.
    #
    # Hashed build assets never change, so they are cached for a year. The
    # school's images under /_sitc/ are not hashed, so they get a short cache.
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
